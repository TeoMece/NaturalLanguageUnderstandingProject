# Esperimento B2 - Sweep di alpha LoRA (richiesto dal lab: "experiment with alpha").
# Eredita dal baseline il miglior lr e dal rank-sweep il miglior rank; varia alpha.
# alpha controlla l'ampiezza dell'adattamento (scaling = alpha/rank).
base: ../base_partB.yaml
override:
  experiment:
    name: partB_alpha
  optim:
    lr: 5.0e-4        # miglior lr da 00_baseline (valid PPL 22.61)
  model:
    rank: 16           # <- aggiornare col miglior rank da 01_rank_sweep
    model: 8
