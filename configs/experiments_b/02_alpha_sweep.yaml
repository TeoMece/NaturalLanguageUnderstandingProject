# Esperimento B2 - Sweep di alpha LoRA (richiesto dal lab: "experiment with alpha").
# Eredita dal baseline il miglior lr e dal rank-sweep il miglior rank; varia alpha.
# alpha controlla l'ampiezza dell'adattamento (scaling = alpha/rank).
base: ../base_partB.yaml
override:
  experiment:
    name: partB_alpha
  optim:
    lr: 5.0e-4        # miglior lr da 00_baseline a bs=32 (valid PPL 21.65; zero-shot=253.09)
    epochs: 18        # budget ridotto per la SOLA sweep (come 01_rank); finale a budget pieno nel finalize
  model:
    rank: 16           # <- aggiornare col miglior rank da 01_rank_sweep (placeholder vecchio run)
sweep:
  model.alpha: [8, 16, 32]
