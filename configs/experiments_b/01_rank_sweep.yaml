# Esperimento B1 - Sweep del rango LoRA (richiesto dal lab: "experiment with rank").
# Eredita dal baseline il miglior lr; varia solo il rank. rank piu' alto = adapter
# piu' espressivi ma piu' parametri; cerchiamo il punto migliore per la PPL.
base: ../base_partB.yaml
override:
  experiment:
    name: partB_rank
  optim:
    lr: 5.0e-4        # miglior lr da 00_baseline (valid PPL 22.59; zero-shot=253.09)
sweep:
  model.rank: [4, 8, 16]
