# Esperimento 1b - FFN width: sweep del rapporto ff_mult (ff_dim = ff_mult*d_model),
# "una cosa alla volta", tenendo fissa la miglior architettura di 01_arch.
# In step separato per non confondere il confronto sulla larghezza d_model col rapporto
# FFN. ff_mult=4 e' la convenzione Transformer/GPT2.
base: ../base_partA.yaml
override:
  experiment:
    name: partA_ff
  model:
    d_model: 384         # <- migliore d_model di 01_arch (aggiornare dopo lo sweep)
    num_layers: 2        # <- migliore num_layers di 01_arch
  optim:
    lr: 5.0e-4           # <- miglior lr del baseline (35.67)
sweep:
  model.ff_mult: [2, 4, 8]
