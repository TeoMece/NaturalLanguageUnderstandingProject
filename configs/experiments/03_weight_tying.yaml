# Esperimento 3 - Aggiunta del weight tying (sopra dropout + migliore config).
base: ../base_partA.yaml
override:
  experiment:
    name: partA_weighttying
  model:
    weight_tying: true
    d_model: 512         # <- migliore d_model di 01_arch (512x2)
    num_layers: 2        # <- migliore num_layers di 01_arch
    dropout:
      enabled: true
      p: 0.1
  optim:
    lr: 5.0e-4           # <- miglior lr del baseline (35.67)
