# Esperimento 3 - Aggiunta del weight tying (sopra dropout + migliore config).
base: ../base_partA.yaml
override:
  experiment:
    name: partA_weighttying
  model:
    weight_tying: true
    d_model: 512         # <- migliore d_model di 01_arch (512x2)
    num_layers: 2        # <- migliore num_layers di 01_arch
    ff_mult: 2           # <- miglior ff_mult di 01b (35.02)
    n_heads: 8           # <- miglior n_heads di 01c (34.77; 512/8=64)
    dropout:
      enabled: false     # <- 02: il dropout NON aiuta (p=0.0=34.84 vince, peggiora con p) -> niente dropout
  optim:
    lr: 5.0e-4           # <- miglior lr del baseline (35.67)
    epochs: 50           # stesse condizioni dello step dropout (convergenza regolarizzata)
    patience: 6          # stesse condizioni dello step dropout (confronto equo tying on/off)
