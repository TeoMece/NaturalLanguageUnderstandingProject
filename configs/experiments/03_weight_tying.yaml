# Esperimento 3 - Aggiunta del weight tying (sopra dropout + migliore config).
base: ../base_partA.yaml
override:
  experiment:
    name: partA_weighttying
  model:
    weight_tying: true
    d_model: 384         # dimensione degli embedding / hidden state
    num_layers: 2        # numero di blocchi transformer
    dropout:
      enabled: true
      p: 0.1
  optim:
    lr: 5.0e-4           # <- miglior lr del baseline (35.67)
