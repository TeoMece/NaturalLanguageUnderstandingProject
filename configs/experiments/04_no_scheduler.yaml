# Esperimento 4 - Ablazione: disattiva lo scheduler sulla MIGLIORE config trovata
# (= quella dell'esperimento 03), per documentare nel report il contributo del
# warmup+cosine decay. Unica differenza rispetto al 03: scheduler.enabled = false.
base: ../base_partA.yaml
override:
  experiment:
    name: partA_noscheduler
  model:
    weight_tying: true   # miglioria confermata nell'esperimento 03
    d_model: 384         # migliore architettura (esperimento 01)
    num_layers: 2        # migliore architettura (esperimento 01)
    dropout:
      enabled: true      # miglior dropout (esperimento 02)
      p: 0.1
  optim:
    lr: 1.0e-3           # miglior lr (baseline post-fix)
    scheduler:
      enabled: false     # <-- l'ablazione: niente warmup+cosine
