# Esperimento 2 - Aggiunta dei 4 punti di dropout sopra la migliore config.
base: ../base_partA.yaml
override:
  experiment:
    name: partA_dropout
  model:
    d_model: 512         # dimensione degli embedding / hidden state
    n_heads: 6           # numero di teste di attention
    dropout:
      enabled: true
      p: 0.1
  optim:
    lr: 5.0e-4 
    # NB: portare qui la migliore architettura/lr dei passi precedenti
