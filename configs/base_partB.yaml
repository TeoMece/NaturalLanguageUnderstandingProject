# Configurazione di base per la Parte 1.B (GPT2 PRE-ADDESTRATO + LoRA su Penn Treebank).
# Gli esperimenti in configs/experiments_b/ ereditano da questo file con
# `base: ../base_partB.yaml` e ne sovrascrivono solo i campi necessari.
experiment:
  name: partB          # nome usato per la cartella della run (sotto runs_b/)
  seed: 42             # seed globale per la riproducibilita'
  device: auto         # auto -> cuda | mps | cpu (risolto a runtime)
data:
  fraction: 1.0        # frazione di frasi di train usate (1.0 = tutte)
  max_samples: null    # alternativa a fraction: numero assoluto di frasi
  subset_seed: 42      # seed per il sottocampionamento riproducibile
  batch_size: 32       # frasi PTB corte (~21 parole): batch grande sfrutta la GPU. A bs=8
                       #   si facevano 5259 micro-batch/epoca = overhead dominante (GPU ferma).
                       #   bs=32 -> ~1315 batch/epoca, ~2-4x piu' veloce, sta in memoria (seq corte).
model:
  name: openai-community/gpt2   # checkpoint HuggingFace da cui partire (pesi pre-addestrati)
  rank: 8              # rango r degli adapter LoRA (da sweeppare: 4/8/16)
  alpha: 16            # fattore di scala alpha degli adapter LoRA (da sweeppare: 16/32)
optim:
  lr: 1.0e-3           # learning rate per AdamW sugli adapter (da tarare)
  optimizer: adamw
  epochs: 30           # tetto alto: a epochs=10 le run NON erano converse (cap binding) ->
                       #   lascia decidere all'early stopping (patience), non al cap
  grad_clip: 1.0       # clipping della norma del gradiente
  patience: 3          # epoche senza miglioramento di valid PPL prima dello stop
mode: dev              # dev -> valuta su valid | final -> full dataset + valuta su test
