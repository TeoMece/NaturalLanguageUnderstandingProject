# GPT2 (decoder) FINALE, miglior lr 5e-5, mode:final su 5 seed. E' uno dei DUE modelli
# da consegnare in 2.B (l'altro e' BERT). Nome 'FINAL' (col tag modello distingue da BERT:
# run = partB_nlu_FINAL__gpt2) -> l'export impacchetta entrambi (bin/gpt2.pt + bert-...pt).
base: ../base_partB_nlu.yaml
override:
  experiment:
    name: partB_nlu_FINAL
  model:
    name: openai-community/gpt2
  optim:
    lr: 5.0e-5         # miglior lr GPT2 (dev slot F1 97.13)
  mode: final          # valuta su TEST (per il confronto)
sweep:
  experiment.seed: [42, 1, 2, 3, 4]   # 5 seed -> test MEDIA ± std
