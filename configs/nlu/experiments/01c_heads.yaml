# Esperimento NLU 1c - n_heads: sweep del numero di teste di attention, "una cosa alla
# volta", tenendo fissa la migliore config trovata finora. Completa la lista del lab
# (d_model, n_heads, num_layers, ff_dim).
# VINCOLO: d_model deve essere divisibile per n_heads. Con d_model=384: 2,4,8 -> ok
# (384/2=192, 384/4=96, 384/8=48). Se cambi d_model, adegua i valori dello sweep.
base: ../base_partA_nlu.yaml
override:
  experiment:
    name: partA_nlu_heads
  model:
    d_model: 384         # miglior arch (01 multi-seed: 384x2, slot F1 96.18); divisibile per n_heads
    num_layers: 2        # miglior arch (01 multi-seed: 384x2)
    ff_mult: 4           # <- aggiornare col miglior ff_mult di 01b_ffn
  optim:
    lr: 1.0e-4           # miglior lr (baseline multi-seed: slot F1 95.96±0.11, miglior intent+stabilita')
sweep:
  model.n_heads: [2, 4, 8]
  experiment.seed: [42, 1, 2, 3, 4]   # 5 seed/valore -> selezione sulla MEDIA (seed_summary.py)
