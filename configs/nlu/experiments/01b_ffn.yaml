# Esperimento NLU 1b - FFN width: sweep del rapporto ff_mult (ff_dim = ff_mult*d_model),
# "una cosa alla volta", tenendo fissa la migliore architettura trovata in 01_arch.
# Lo facciamo in uno step separato (e non dentro 01_arch) per non confondere il
# confronto sulla larghezza d_model col rapporto FFN. ff_mult=4 e' la convenzione
# Transformer/GPT2; qui testiamo se una FFN piu' stretta (2x) o piu' larga (8x) aiuti.
base: ../base_partA_nlu.yaml
override:
  experiment:
    name: partA_nlu_ffn
  model:
    d_model: 256         # miglior arch (01: dev slot F1 96.52); divisibile per n_heads
    num_layers: 2        # miglior arch (esperimento 01)
  optim:
    lr: 1.0e-4           # miglior lr (baseline multi-seed: slot F1 95.96±0.11, miglior intent+stabilita')
sweep:
  model.ff_mult: [2, 4, 8]
  experiment.seed: [42, 1, 2, 3, 4]   # 5 seed/valore -> selezione sulla MEDIA (seed_summary.py)
