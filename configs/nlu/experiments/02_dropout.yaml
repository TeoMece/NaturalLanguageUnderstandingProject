# Esperimento NLU 2 - Dropout prima delle teste (sopra la migliore config).
base: ../base_partA_nlu.yaml
override:
  experiment:
    name: partA_nlu_dropout
  model:
    d_model: 256         # miglior arch (01: dev slot F1 96.52); divisibile per n_heads
    num_layers: 2
    dropout:
      enabled: true
  optim:
    lr: 1.0e-4           # miglior lr (baseline multi-seed: slot F1 95.96±0.11, miglior intent+stabilita')
# risoluzione piu' fine nella zona bassa (dove di solito sta l'ottimo) + un valore alto
sweep:
  model.dropout.p: [0.1, 0.2, 0.3, 0.5]
  experiment.seed: [42, 1, 2, 3, 4]   # 5 seed/valore -> selezione sulla MEDIA (seed_summary.py)
